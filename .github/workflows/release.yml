name: Release translations and self-contained native Windows installer

on:
  push:
    tags: ['JP-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースを（再）作成するタグ（例: JP-Ver15.0Beta）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  native-installer:
    # Build the maintained native source on main, not outdated translation tag.
    uses: ./.github/workflows/build-native-installer.yml
    with:
      native_ref: main

  release:
    needs: native-installer
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out exact translation release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Validate translation release tag
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^JP-[A-Za-z0-9._-]+$ ]]; then
            echo 'Invalid translation release tag' >&2
            exit 1
          fi

      - name: Set up .NET for translation tests only
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test translations
        run: dotnet test SCPSLTranslationJP.slnx -c Release

      - name: Create translation ZIP
        run: |
          cd JP
          zip -r "../$TAG.zip" *

      - name: Download native Windows installer
        uses: actions/download-artifact@v4
        with:
          name: SCPSL-SelfContained-Windows-x64
          path: .

      - name: Verify self-contained SCPSL.exe
        shell: bash
        run: |
          test -f SCPSL.exe
          size=$(stat -c%s SCPSL.exe)
          echo "Self-contained native installer: $size bytes"
          test "$size" -gt 20000000
          test "$size" -lt 50000000
          sha256sum SCPSL.exe

      - name: Generate release notes with new native installer instructions
        shell: bash
        run: |
          TAG="$TAG" REPO="${{ github.repository }}" bash .github/scripts/release-notes.sh > base-notes.md
          python3 - <<'PY'
          from pathlib import Path
          notes=Path("base-notes.md").read_text(encoding="utf-8")
          marker="## インストーラーを使用するインストール方法"
          if marker in notes:
              notes=notes.split(marker,1)[0].rstrip()
          native="""
          ## Windows ネイティブ日本語化インストーラー
          - **SCPSL.exe** をダウンロードして実行してください。
          - C++/WinRT + Rust のWindows x64ネイティブ版です。
          - Windows App Runtime/.NET/WebView2を別途インストールする必要はありません。
          - Windows App SDK 1.8の必要なDLLは単一EXEに含まれ、初回実行時にアプリ専用領域へ展開されます。
          - Steamからゲームフォルダーを自動検出できます。日本語訳の安定版/Beta版を選んでインストールできます。
          - SCP:SLを終了してから翻訳をインストールしてください。
          - Linux版インストーラーはこのWinUI版では提供していません。Linuxでは翻訳ZIPを手動で適用してください。
          """
          Path("notes.md").write_text(notes+"\n\n"+native.strip()+"\n",encoding="utf-8")
          PY

      - name: Use maintained v15 Private Beta release instructions
        if: env.TAG == 'JP-Ver15.0Beta'
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/docs/releases/JP-Ver15.0Beta.md?ref=main" --jq '.content' | base64 -d > notes.md
          test -s notes.md
          grep -Fqx '## インストール方法' notes.md

      - name: Publish translation ZIP and replace Windows installer release asset
        shell: bash
        run: |
          title="$(echo "$TAG" | cut -c4-)日本語翻訳"
          # Never mark Beta translation packages as the latest stable release.
          if [[ "$TAG" == *Beta* || "$TAG" == *beta* ]]; then
            release_flags=(--prerelease)
          else
            release_flags=(--latest)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TAG.zip" SCPSL.exe --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md "${release_flags[@]}"
          else
            gh release create "$TAG" "$TAG.zip" SCPSL.exe --title "$title" --notes-file notes.md --verify-tag "${release_flags[@]}"
          fi
