name: Cancel stale Store CI run (temporary maintenance)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stuck-store-ci.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel exact hung run from temporary root-certificate trust test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/44539328025/cancel"
