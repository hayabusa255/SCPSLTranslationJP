<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻訳エディタ</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --text: #1d2229; --muted: #6a7482; --border: #d9dde3;
  --accent: #2f6fdb; --warn-bg: #fff3d6; --err-bg: #fde4e4; --dirty-bg: #e3f0ff; --err: #b3261e; --warn: #8a5a00;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171b; --panel: #1c2026; --text: #e3e6ea; --muted: #8d97a5; --border: #333a44;
    --accent: #6ea2ff; --warn-bg: #3b3115; --err-bg: #412222; --dirty-bg: #1e3350; --err: #ff8f87; --warn: #e8b84a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Noto Sans CJK JP", "Yu Gothic UI", sans-serif; display: flex; }
#side { width: 260px; flex: none; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; height: 100vh; }
#side input { margin: 8px; padding: 6px 8px; }
#list { overflow-y: auto; flex: 1; }
.file { display: flex; justify-content: space-between; gap: 6px; padding: 5px 10px; cursor: pointer; border-left: 3px solid transparent; }
.file:hover { background: var(--bg); }
.file.active { background: var(--dirty-bg); border-left-color: var(--accent); }
.file .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 12px; color: var(--muted); white-space: nowrap; }
.badge.todo { color: var(--warn); font-weight: 600; }
.badge.mismatch { color: var(--err); font-weight: 600; }
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
#bar { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
#bar .title { font-weight: 600; }
#bar .spacer { flex: 1; }
#dirty { color: var(--accent); font-weight: 600; }
#msg { color: var(--muted); }
#msg.err { color: var(--err); }
button { padding: 6px 14px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 4px; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
input[type=search], #side input { border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 4px; }
#bar input[type=search] { padding: 5px 8px; width: 220px; }
#warn { padding: 6px 12px; background: var(--warn-bg); color: var(--warn); display: none; }
#scroll { flex: 1; overflow: auto; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { position: sticky; top: 0; background: var(--panel); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); z-index: 1; }
td { vertical-align: top; padding: 4px 8px; border-bottom: 1px solid var(--border); }
td.num { width: 52px; color: var(--muted); text-align: right; }
td.en { white-space: pre-wrap; word-break: break-word; width: 42%; }
tr.untr td { background: var(--warn-bg); }
tr.ph td { background: var(--err-bg); }
tr.dirty td.num { box-shadow: inset 3px 0 var(--accent); }
tr.dirty td.jp { background: var(--dirty-bg); }
textarea { width: 100%; resize: none; overflow: hidden; border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; font: inherit; background: var(--panel); color: var(--text); min-height: 28px; }
.phinfo { font-size: 11px; color: var(--err); margin-top: 2px; }
.empty { padding: 24px; color: var(--muted); }
</style>
</head>
<body>
<aside id="side">
  <input id="ffilter" type="search" placeholder="ファイル名で絞り込み">
  <div id="list"></div>
</aside>
<section id="main">
  <div id="bar">
    <span class="title" id="title">ファイルを選択してください</span>
    <label><input type="checkbox" id="onlyIssues"> 未翻訳/問題のある行だけ</label>
    <input type="search" id="q" placeholder="EN/JP 本文を検索">
    <span class="spacer"></span>
    <span id="dirty"></span>
    <span id="msg"></span>
    <button id="save" disabled>保存 (Ctrl+S)</button>
  </div>
  <div id="warn"></div>
  <div id="scroll"><div class="empty">左のリストからファイルを選んでください。</div></div>
</section>
<script>
const $ = id => document.getElementById(id);
let files = [], current = null, rows = [], dirtyCount = 0;

// Same token rules as TranslationChecker/PlaceholderChecker.cs.
const TOKEN = /\[([A-Za-z_]\w*)\]|\{(\w+)\}|(%%|%(?:\d+\$)?[-+ 0#]*\d*(?:\.\d+)?[sdifuxX])|<(\/?[A-Za-z][A-Za-z0-9]*)(?:[=\s][^>]*)?>/g;
function tokens(s) {
  const set = new Set();
  for (const m of s.matchAll(TOKEN)) {
    if (m[1] !== undefined) set.add('[' + m[1] + ']');
    else if (m[2] !== undefined) set.add('{' + m[2] + '}');
    else if (m[3] !== undefined) set.add(m[3]);
    else set.add('<' + m[4].toLowerCase() + '>');
  }
  return set;
}
function phDiff(en, jp) {
  const a = tokens(en), b = tokens(jp);
  const missing = [...a].filter(t => !b.has(t)).sort();
  const extra = [...b].filter(t => !a.has(t) && !t.startsWith('<')).sort();
  return { missing, extra };
}

function setMsg(t, err) { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }
function updateDirty() {
  dirtyCount = rows.filter(r => r.jp !== r.saved).length;
  $('dirty').textContent = dirtyCount ? `● 未保存 ${dirtyCount} 行` : '';
  $('save').disabled = !current || !dirtyCount;
}

async function loadList() {
  files = await (await fetch('/api/files')).json();
  renderList();
}
function renderList() {
  const f = $('ffilter').value.toLowerCase();
  const box = $('list'); box.textContent = '';
  for (const x of files) {
    if (f && !x.name.toLowerCase().includes(f)) continue;
    const d = document.createElement('div');
    d.className = 'file' + (current === x.name ? ' active' : '');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = x.name; n.title = x.name;
    const b = document.createElement('span'); b.className = 'badge';
    if (x.jpLines !== x.enLines) { b.textContent = `⚠ ${x.jpLines}/${x.enLines}`; b.className += ' mismatch'; b.title = '行数が en と一致しません'; }
    else if (x.untranslated) { b.textContent = `未 ${x.untranslated}`; b.className += ' todo'; b.title = `未翻訳 ${x.untranslated} / ${x.enLines} 行`; }
    else { b.textContent = `${x.enLines}`; }
    d.append(n, b);
    d.onclick = () => openFile(x.name);
    box.append(d);
  }
}

function confirmDiscard() { return !dirtyCount || confirm('未保存の変更があります。破棄して続けますか？'); }

async function openFile(name) {
  if (name === current) return;
  if (!confirmDiscard()) return;
  setMsg('読み込み中…');
  const res = await fetch('/api/files/' + encodeURIComponent(name));
  if (!res.ok) { setMsg('読み込みに失敗しました', true); return; }
  const d = await res.json();
  current = name;
  rows = d.lines.map(l => ({ line: l.line, en: l.en, jp: l.jp, saved: l.jp }));
  $('title').textContent = name;
  const w = $('warn');
  if (d.extra.length) { w.style.display = 'block'; w.textContent = `JP に en より ${d.extra.length} 行多く含まれています（保存すると超過分は削除されます）。`; }
  else w.style.display = 'none';
  setMsg('');
  renderTable();
  renderList();
  updateDirty();
  $('scroll').scrollTop = 0;
}

function rowState(r) {
  const untr = r.jp === '' || r.jp === r.en;
  const d = phDiff(r.en, r.jp);
  const ph = !untr && (d.missing.length || d.extra.length);
  return { untr, ph, d, dirty: r.jp !== r.saved };
}
function applyState(tr, r) {
  const s = rowState(r);
  tr.classList.toggle('untr', s.untr);
  tr.classList.toggle('ph', !!s.ph);
  tr.classList.toggle('dirty', s.dirty);
  const info = tr.querySelector('.phinfo');
  const parts = [];
  if (s.ph) {
    if (s.d.missing.length) parts.push('不足: ' + s.d.missing.join(' '));
    if (s.d.extra.length) parts.push('余分: ' + s.d.extra.join(' '));
  }
  info.textContent = parts.join(' / ');
  tr.dataset.issue = (s.untr || s.ph) ? '1' : '';
}
function autosize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }

function renderTable() {
  const sc = $('scroll'); sc.textContent = '';
  const table = document.createElement('table');
  table.innerHTML = '<colgroup><col style="width:52px"><col style="width:42%"><col></colgroup><thead><tr><th style="text-align:right">#</th><th>EN</th><th>JP</th></tr></thead>';
  const tb = document.createElement('tbody');
  for (const r of rows) {
    const tr = document.createElement('tr');
    const n = document.createElement('td'); n.className = 'num'; n.textContent = r.line;
    const e = document.createElement('td'); e.className = 'en'; e.textContent = r.en;
    const j = document.createElement('td'); j.className = 'jp';
    const t = document.createElement('textarea'); t.rows = 1; t.value = r.jp; t.spellcheck = false;
    const info = document.createElement('div'); info.className = 'phinfo';
    t.addEventListener('input', () => { r.jp = t.value; autosize(t); applyState(tr, r); updateDirty(); });
    t.addEventListener('keydown', ev => { if (ev.key === 'Enter') ev.preventDefault(); }); // one line per row
    j.append(t, info);
    tr.append(n, e, j);
    tr._r = r; tr._t = t;
    applyState(tr, r);
    tb.append(tr);
  }
  table.append(tb);
  sc.append(table);
  applyFilter();
  for (const tr of tb.children) autosize(tr._t);
}

function applyFilter() {
  const only = $('onlyIssues').checked, q = $('q').value.toLowerCase();
  const tb = document.querySelector('tbody'); if (!tb) return;
  for (const tr of tb.children) {
    const r = tr._r;
    let show = true;
    if (only && !(tr.dataset.issue || r.jp !== r.saved)) show = false;
    if (show && q && !(r.en.toLowerCase().includes(q) || r.jp.toLowerCase().includes(q))) show = false;
    tr.style.display = show ? '' : 'none';
    if (show) autosize(tr._t);
  }
}

async function save() {
  if (!current || !dirtyCount) return;
  setMsg('保存中…');
  const res = await fetch('/api/files/' + encodeURIComponent(current), {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lines: rows.map(r => r.jp) })
  });
  if (!res.ok) { let m = ''; try { m = (await res.json()).error; } catch {} setMsg('保存に失敗しました ' + (m || res.status), true); return; }
  for (const r of rows) r.saved = r.jp;
  document.querySelectorAll('tbody tr').forEach(tr => applyState(tr, tr._r));
  $('warn').style.display = 'none';
  updateDirty();
  setMsg('保存しました');
  await loadList();
}

$('save').onclick = save;
$('onlyIssues').onchange = applyFilter;
$('q').oninput = applyFilter;
$('ffilter').oninput = renderList;
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); } });
window.addEventListener('beforeunload', e => { if (dirtyCount) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', () => document.querySelectorAll('tbody textarea').forEach(autosize));
loadList();
</script>
</body>
</html>
